name: Fork Read Aloud Test APK

on:
  push:
    branches: [feat/read-aloud-quick-toggle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    if: github.repository == 'tidley/whitenoise-android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure native cache
        run: printf 'WHITENOISE_MARMOTKIT_CACHE_DIR=%s\n' "$RUNNER_TEMP/marmotkit-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Validate manual test documentation
        run: |
          python3 scripts/check_manual_test_guide.py
          python3 -m unittest scripts/test_check_manual_test_guide.py scripts/test_manual_test_fragments.py
      - name: Check Kotlin style
        run: ./gradlew :app:ktlintCheck :app:detekt --continue --no-daemon --stacktrace
      - name: Exercise composer and speech regressions in both distributions
        run: |
          for flavor in Zapstore Play; do
            ./gradlew ":app:testDev${flavor}DebugUnitTest" \
              --tests '*ComposerDictationControlTest' \
              --tests '*ConversationComposerFullScreenRetentionScreenshotTest.speakerShortcutFollowsOptInWithoutChangingSpeechPolicy' \
              --tests '*ConversationComposerFullScreenRetentionScreenshotTest.conversationSettingRevealsSpeakerAndSpeakerKeepsTogglingOnlyThisChat' \
              --tests '*WhiteNoiseAppStateTtsAutoReadTest' \
              --tests '*TtsAutoReadPreferencesTest' \
              --tests '*TtsAutoReadScreenIntegrationTest' \
              --tests '*TtsVoiceMediaSettingsScreenshotTest' \
              --tests '*ConversationAutoReadResumeTest' \
              --tests '*ConversationAutoReadArrivalTest' \
              --tests '*TtsAutoReadWiringCoverageTest' \
              --tests '*ComposerAutoReadScreenshotTest' \
              -Proborazzi.test.verify=true -PciTestForks=1 --no-daemon --stacktrace
          done
      - name: Build isolated dev APK
        run: |
          ./gradlew :app:assembleDevPlayDebug \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false --no-daemon --stacktrace
          mkdir -p test-apk
          # AGP's device-targeted assembly writes to intermediates/apk.
          for root in app/build/outputs/apk app/build/intermediates/apk; do
            if [[ -d "$root" ]]; then
              find "$root" -type f -name '*.apk' -exec cp '{}' test-apk/ \;
            fi
          done
          test -n "$(find test-apk -name '*.apk' -print -quit)"
          for apk in test-apk/*.apk; do
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            grep -q "^package: name='dev[.]ipf[.]whitenoise[.]android[.]dev' " <<< "$badging"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          done
          printf '%s\n' "$GITHUB_SHA" > test-apk/SOURCE_COMMIT
          (cd test-apk && sha256sum *.apk > SHA256SUMS)
      - name: Checkout current-master smoke baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: marmot-protocol/whitenoise-android
          ref: bea6135181e29eda592f8dbfba88c714fd44ace6
          path: smoke-baseline
          persist-credentials: false
      - name: Build compatible populated-upgrade baseline
        run: |
          cmp app/src/main/marmotkit/MARMOT_VERSION smoke-baseline/app/src/main/marmotkit/MARMOT_VERSION
          (cd smoke-baseline && ./gradlew :app:assembleDevPlayDebug \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false --no-daemon --stacktrace)
          mkdir -p baseline-apk
          for root in smoke-baseline/app/build/outputs/apk smoke-baseline/app/build/intermediates/apk; do
            if [[ -d "$root" ]]; then
              find "$root" -type f -name '*.apk' -exec cp '{}' baseline-apk/ \;
            fi
          done
          test -n "$(find baseline-apk -name '*.apk' -print -quit)"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          candidate_cert=$("$signer" verify --print-certs test-apk/*.apk | grep 'Signer #1 certificate SHA-256 digest:')
          for apk in baseline-apk/*.apk; do
            badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
            grep -q "^package: name='dev[.]ipf[.]whitenoise[.]android[.]dev' " <<< "$badging"
            baseline_cert=$("$signer" verify --print-certs "$apk" | grep 'Signer #1 certificate SHA-256 digest:')
            [[ "$candidate_cert" == "$baseline_cert" ]]
          done
          printf '%s\n' 'bea6135181e29eda592f8dbfba88c714fd44ace6' > baseline-apk/SOURCE_COMMIT
          (cd baseline-apk && sha256sum *.apk > SHA256SUMS)
      - name: Retain isolated candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: read-aloud-dev-apk
          path: test-apk/
          if-no-files-found: error
      - name: Retain compatible smoke baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: read-aloud-baseline-apk
          path: baseline-apk/
          if-no-files-found: error
      - name: Retain test results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: read-aloud-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/detekt/
            app/build/reports/ktlint/
            app/src/test/snapshots/composer_auto_read_*.png
